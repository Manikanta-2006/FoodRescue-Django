{% if messages %}
<div class="container mt-3">
    {% for message in messages %}
    <div class="alert alert-{{ message.tags }} alert-dismissible fade show shadow-sm d-flex align-items-center" role="alert">
        <i class="bi 
            {% if message.tags == 'success' %}bi-check-circle-fill text-success
            {% elif message.tags == 'danger' or message.tags == 'error' %}bi-exclamation-triangle-fill text-danger
            {% elif message.tags == 'warning' %}bi-exclamation-circle-fill text-warning
            {% else %}bi-info-circle-fill text-primary{% endif %} fs-5 me-2"></i>
        <div class="flex-grow-1">
            {{ message }}
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    {% endfor %}
</div>
{% endif %}
